name: Daily OHLCV

on:
  schedule:
    - cron: "41 15 * * *"   # once a day, 15:41 UTC = 8:41 AM PDT / 7:41 AM PST
  workflow_dispatch:         # "Run workflow" button = immediate run

permissions:
  contents: write

concurrency:
  group: ohlcv
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AV_OUTPUTSIZE: "full"    # max history; auto-falls back to compact if the key isn't premium
      BATCH_SIZE: "20"         # target
      PROBE: "1"               # keep going 21, 22, ... until Alpha Vantage says stop
      MAX_PER_RUN: "100"
      BQ_TABLE: "besa-capital-financials.financial_data.daily_ohlcv"
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet google-cloud-bigquery

      - name: Download batch + load BigQuery
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python download_ohlcv.py

      - name: Commit CSVs + cursor
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "OHLCV batch $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
