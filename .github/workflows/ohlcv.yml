name: Daily OHLCV

on:
  schedule:
    - cron: "41 15 * * *"   # once a day, 15:41 UTC = 8:41 AM PDT / 7:41 AM PST
  workflow_dispatch:         # "Run workflow" button = immediate run

permissions:
  contents: write

concurrency:
  group: ohlcv
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AV_OUTPUTSIZE: "full"    # max history; auto-falls back to compact if the key isn't premium
      BATCH_SIZE: "20"         # target
      PROBE: "1"               # keep going 21, 22, ... until Alpha Vantage says stop
      MAX_PER_RUN: "100"
      BQ_TABLE: "besa-capital-financials.financial_data.daily_ohlcv"
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets shape (no values printed)
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
          AV: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          sa, av = os.environ.get("SA", ""), os.environ.get("AV", "")
          s = sa.strip()
          print(f"GCP_SA_KEY: length={len(sa)} starts_with_brace={s[:1]=='{'} ends_with_brace={s[-1:]=='}'}")
          ok = True
          try:
              d = json.loads(s)
              print(f"GCP_SA_KEY: valid JSON, type={d.get('type')}, has_private_key={'private_key' in d}, "
                    f"client_email_domain={d.get('client_email','').split('@')[-1]}")
              ok = d.get("type") == "service_account" and "private_key" in d
          except Exception as e:
              print(f"GCP_SA_KEY: NOT valid JSON ({type(e).__name__}) -> paste the whole block from {{ to }}")
              ok = False
          print(f"ALPHA_VANTAGE_KEY: length={len(av.strip())} alnum={av.strip().isalnum()}")
          if not av.strip():
              ok = False
          sys.exit(0 if ok else 1)
          EOF

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet google-cloud-bigquery

      - name: Download batch + load BigQuery
        id: dl
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python download_ohlcv.py

      - name: Commit CSVs + cursor
        if: always() && steps.dl.outcome != 'skipped'
        run: |
          mkdir -p data state
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "OHLCV batch $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
